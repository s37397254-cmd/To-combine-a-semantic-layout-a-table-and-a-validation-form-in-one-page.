<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="width:700px; height: 50px; background-color: rgb(6, 6, 75); margin-left: 150px; color: white;">
        <h1 style="margin-left: 100px;">ABC College Admission 2026</h1></div>
        <h1 style="margin-left: 250px;">Courses and Fees</h1>
        <table border="2" width="500" height="80" style="margin-left: 250px;">
            <tbody >
                <caption>Available Courses</caption>
                <thead>
                    <tr>
                        <td style="background-color: rgb(143, 143, 211);"><B>Courses</B></td>
                        <td style="background-color: rgb(142, 142, 202);"><B>seats</B></td>
                        <td style="background-color: rgb(144, 144, 202);"><B>Fees</B></td>
                    </tr>
                    <tr>
                        <td>B.Tech CSE</td>
                        <td>120</td>
                        <td>90,000</td>
                    </tr>
                    <tr>
                        <td>BCA</td>
                        <TD>60</TD>
                        <TD>45,000</TD>
                    </tr>

                </thead>
                
                
                
            </tbody>
        </table>
        <form action="" style="margin-left: 250px;">
            <fieldset>
                <legend>Application Form</legend>
                <label for="name">NAME:</label>
                <br>
                <input type="text" id="name" placeholder="enter name" required><br><br>
                <label for="email">EMAIL:</label>
                <br>
                <input type="text" id="email" placeholder="enter email" required><br><br>
                <label for name="Courses">Courses:</label><br>
                <select name="Courses">
                    <option>B.Tech</option>
                    <option>BCA</option>
                </select><br><br>
                <label for="statement">Statement:</label><br>
                <textarea rows="6" cols="70"></textarea><br><br>
                <input type="submit" id="apply" value="Apply" required>          
            </fieldset>
        </form><br>
    <div style="width: 800px; height: 40px;background-color: rgb(4, 4, 58); margin-left: 150px; color: white;">
        <p style="margin-left: 300px;">&copy 2026 ABC college </p>
    </div>

    
</body>
</html>
